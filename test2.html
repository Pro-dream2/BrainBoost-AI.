<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .bg-lines div {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #fff, transparent);
            animation: lineMove 3s linear infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 40px;
        }

        .error-box {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .error-number {
            font-size: clamp(100px, 20vw, 200px);
            font-weight: 700;
            line-height: 1;
            position: relative;
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            animation: numberPulse 2s ease-in-out infinite;
        }

        .error-number::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            color: #fff;
            opacity: 0.5;
            filter: blur(8px);
            animation: numberGlow 2s ease-in-out infinite;
        }

        .error-content {
            flex: 1;
            min-width: 300px;
        }

        .error-title {
            font-size: clamp(24px, 4vw, 36px);
            margin-bottom: 20px;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #666);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .error-message {
            font-size: 18px;
            line-height: 1.6;
            color: #999;
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            padding: 15px 30px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .back-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                rgba(255,255,255,0.1), 
                rgba(255,255,255,0.5), 
                rgba(255,255,255,0.1));
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .back-link:hover::before {
            transform: translateX(100%);
        }

        .visual-box {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(45deg, #111, #222);
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            animation: waveMove 10s linear infinite;
        }

        .dots {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .dot {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: dotFloat 3s ease-in-out infinite;
        }

        @keyframes lineMove {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes numberPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes numberGlow {
            0%, 100% { opacity: 0.5; filter: blur(8px); }
            50% { opacity: 0.8; filter: blur(12px); }
        }

        @keyframes waveMove {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(0%) rotate(360deg); }
        }

        @keyframes dotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                gap: 30px;
            }

            .error-box {
                gap: 30px;
            }

            .error-message {
                font-size: 16px;
            }

            .visual-box {
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .error-box {
                text-align: center;
                justify-content: center;
            }

            .error-content {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .error-message {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <?php
    http_response_code(404);
    ?>
    
    <div class="bg-lines">
        <?php
        for($i = 0; $i < 20; $i++) {
            $left = rand(0, 100);
            $delay = $i * -0.2;
            echo "<div style='left: {$left}%; animation-delay: {$delay}s;'></div>";
        }
        ?>
    </div>

    <div class="container">
        <div class="error-box">
            <div class="error-number">404</div>
            <div class="error-content">
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-message">
                    The page you're looking for doesn't exist. It might have been moved, deleted, or never existed in the first place.
                </p>
                <a href="/" class="back-link">Return Home</a>
            </div>
        </div>

        <div class="visual-box">
            <div class="wave"></div>
            <div class="dots">
                <?php
                for($i = 0; $i < 30; $i++) {
                    $size = rand(2, 6);
                    $top = rand(0, 100);
                    $left = rand(0, 100);
                    $delay = $i * 0.1;
                    $duration = rand(2, 4);
                    echo "<div class='dot' style='
                        width: {$size}px;
                        height: {$size}px;
                        top: {$top}%;
                        left: {$left}%;
                        animation-delay: {$delay}s;
                        animation-duration: {$duration}s;
                        opacity: " . (rand(3, 8) / 10) . ";
                    '></div>";
                }
                ?>
            </div>
        </div>
    </div>

    <script>
        // Dalga efekti için SVG oluştur
        const wave = document.querySelector('.wave');
        const waveWidth = 800;
        const waveHeight = 100;
        
        const createWavePath = () => {
            let path = `M0,${waveHeight/2}`;
            
            for(let i = 0; i <= waveWidth; i += 50) {
                const x = i;
                const y = (Math.sin(i/50) * 20) + waveHeight/2;
                path += ` L${x},${y}`;
            }
            
            path += ` L${waveWidth},${waveHeight} L0,${waveHeight} Z`;
            return path;
        };
        
        wave.innerHTML = `
            <svg width="100%" height="100%" viewBox="0 0 ${waveWidth} ${waveHeight}">
                <path d="${createWavePath()}" fill="rgba(255,255,255,0.1)" />
            </svg>
        `;

        // Mouse hareketi ile etkileşim
        document.addEventListener('mousemove', (e) => {
            const dots = document.querySelectorAll('.dot');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            dots.forEach(dot => {
                const rect = dot.getBoundingClientRect();
                const x = (mouseX - 0.5) * 20;
                const y = (mouseY - 0.5) * 20;
                
                dot.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
